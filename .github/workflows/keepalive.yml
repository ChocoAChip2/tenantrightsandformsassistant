name: Supabase Keep-Alive

# Supabase's free tier auto-pauses a project after ~7 days without user
# database activity:
# https://supabase.com/docs/guides/platform/free-project-pausing
#
# This already happened once and took the app down without anyone noticing.
# This workflow issues a trivial authenticated query against a real table
# every 6 days, leaving a day of safety margin before the 7-day threshold.
#
# WHY A REAL TABLE QUERY, NOT A BARE PING:
# Supabase's own docs describe the activity check as "user requests to the
# database", generated by API calls or dashboard visits -- not simply
# reachability of the API gateway. Hitting the bare REST root
# (`{url}/rest/v1/`) only returns PostgREST's generated OpenAPI schema and
# is not documented as counting toward this check, so this workflow selects
# from an actual table instead. That forces PostgREST to plan and execute a
# real query against Postgres. RLS is enabled on every table and this key
# carries no user JWT, so the query legitimately returns zero rows -- that's
# expected and fine. The query executing is what counts, not what it
# returns, and this also means the workflow log never contains real user
# data.
#
# KNOWN LIMITATION -- READ THIS IF THE PROJECT PAUSES AGAIN:
# GitHub automatically disables scheduled workflows after 60 days with no
# repository activity (any push, PR, etc. across any branch resets this).
# If this repo goes quiet for that long, this workflow stops firing with NO
# notification, and the Supabase project will pause again. There is nothing
# a workflow can do about this from the inside -- the fix is knowing to
# check Actions -> Supabase Keep-Alive for a "This scheduled workflow is
# disabled" banner and re-enabling it (or just pushing any commit) after any
# long quiet period. See:
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
#
# CRON NOTE: `*/6` on the day-of-month field does not divide evenly across
# every calendar month, but the worst-case gap between two consecutive runs
# works out to exactly 6 days (verified by hand for 28/29/30/31-day months),
# so this never crosses the 7-day pause threshold. GitHub also does not
# guarantee scheduled workflows fire at the exact minute requested -- under
# load they can be delayed -- which is additional reason the 1-day margin
# exists.

on:
  schedule:
    - cron: "0 12 */6 * *"
  # Lets a human trigger a run on demand from the Actions tab, e.g. to
  # verify secrets are configured correctly after rotating a key.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase to keep the project active
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_KEY repository secrets are not set. See README.md."
            exit 1
          fi

          http_status=$(curl -sS -o /tmp/keepalive_response.json -w "%{http_code}" \
            --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/conversations?select=id&limit=1")

          echo "HTTP status: ${http_status}"
          cat /tmp/keepalive_response.json
          echo

          # 200 means PostgREST planned and ran the query against Postgres --
          # that's the activity signal, regardless of how many rows RLS lets
          # it return. Anything else is a real failure, with one caveat: a
          # project that is still resuming from a prior pause can return a
          # non-200 status for a short window. Check the Supabase dashboard
          # for a paused/restoring project before assuming this workflow
          # itself is broken.
          if [ "$http_status" != "200" ]; then
            echo "::error::Unexpected HTTP status ${http_status} from Supabase. Check the Supabase dashboard for a paused/restoring project before assuming this workflow is broken."
            exit 1
          fi
