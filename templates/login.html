<!doctype html>
<html lang="en">
<head>
  <!-- Page metadata and page-local styling for the login screen. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYC Tenant Assistant | Login</title>
  <style>
    /* Same design tokens as signup.html and chat.html -- keep these three
       in sync if the palette ever changes. */
    :root {
      color-scheme: light;
      --bg: #f7f5f1;
      --surface: #ffffff;
      --border: #e5e0d6;
      --text: #2c2a26;
      --muted: #746e63;
      --accent: #c2683f;
      --accent-hover: #ab5734;
      --accent-tint: #f5e6dc;
      --error: #b3392c;
      --error-tint: #fbeae7;
      --success: #3a6b4c;
      --success-tint: #e9f2ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 1px 2px rgba(44, 42, 38, 0.04);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--accent);
      flex-shrink: 0;
    }
    .brand-name { font-size: 15px; font-weight: 600; color: var(--text); }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 24px; line-height: 1.5; }

    .notice {
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    .notice.error { background: var(--error-tint); color: var(--error); }
    .notice.success { background: var(--success-tint); color: var(--success); }
    .notice p { margin: 0; }

    form { display: grid; gap: 16px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--text); }
    .field input {
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }
    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-tint);
    }

    button.primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 9px;
      border: 0;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
    }
    button.primary:hover { background: var(--accent-hover); }

    .footer-link {
      margin: 20px 0 0;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }
    .footer-link a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <span class="brand-name">NYC Tenant Assistant</span>
    </div>

    <h1>Log in</h1>
    <p class="subtitle">Use your confirmed account to continue.</p>

    <!-- Flash messages explain validation errors or successful signup redirects. -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="notice {{ category }}"><p>{{ message }}</p></div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- This form posts to the login route, which authenticates through
         supabase_service.py and stores the user email in the Flask session. -->
    <form method="POST">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required>
      </div>
      <button class="primary" type="submit">Log in</button>
    </form>

    <p class="footer-link">Need an account? <a href="{{ url_for('main.signup') }}">Create one</a></p>
  </div>
</body>
</html>
